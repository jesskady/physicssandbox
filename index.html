<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Sandbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Left panel: wave menu -->
  <div id="left-panel" class="panel">
    <h2>Wave</h2>
    <canvas id="wave-canvas"></canvas>
    <div class="controls">
      <div class="control">
        <label>Wave Speed <span id="wave-speed-val"></span></label>
        <input type="range" id="wave-speed" step="0.01">
        <div class="minmax">
          <input type="number" id="wave-speed-min" step="0.1" title="min">
          <input type="number" id="wave-speed-max" step="0.1" title="max">
        </div>
      </div>
      <div class="control">
        <label>Wave Amplitude <span id="wave-amp-val"></span></label>
        <input type="range" id="wave-amp" step="0.005">
        <div class="minmax">
          <input type="number" id="wave-amp-min" step="0.01" title="min">
          <input type="number" id="wave-amp-max" step="0.01" title="max">
        </div>
      </div>
    </div>
  </div>

  <!-- Center: play area -->
  <div id="center-panel">
    <canvas id="play-canvas"></canvas>
    <div id="help">
      <b>add:</b> click: dot &nbsp;·&nbsp; drag dot→dot: line &nbsp;·&nbsp; click line: muscle &nbsp;·&nbsp;
      shift+drag: move &nbsp;—&nbsp; <b>select:</b> drag box to select, drag a dot to move all
      &nbsp;—&nbsp; right-click: delete
    </div>
  </div>

  <!-- Right panel: physics menu -->
  <div id="right-panel" class="panel">
    <button id="play-btn">▶ Play</button>
    <button id="mode-btn">Mode: Add</button>
    <div id="history-controls">
      <button id="undo-btn" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    </div>
    <h2>Physics</h2>
    <div class="controls">
      <div class="control">
        <label>Gravity <span id="gravity-val"></span></label>
        <input type="range" id="gravity" step="1">
        <div class="minmax">
          <input type="number" id="gravity-min" step="10" title="min">
          <input type="number" id="gravity-max" step="10" title="max">
        </div>
      </div>
      <div class="control">
        <label>Rubber <span id="rubber-val"></span></label>
        <input type="range" id="rubber" min="0" max="1" step="0.01">
      </div>
      <div class="control">
        <label>Friction <span id="friction-val"></span></label>
        <input type="range" id="friction" min="0" max="1" step="0.01">
      </div>
      <div class="control">
        <label>Line Stiffness <span id="stiffness-val"></span></label>
        <input type="range" id="stiffness" min="0.05" max="1" step="0.01">
      </div>
      <div class="control">
        <label class="checkbox-label" title="During play, the wave reverses direction when the structure hits a side wall">
          <input type="checkbox" id="wall-reverse" checked>
          Reverse at side walls
        </label>
        <label class="inline-num" title="Minimum seconds between direction flips">
          Reverse cooldown (s)
          <input type="number" id="wall-cooldown" min="0" step="0.1">
        </label>
      </div>
    </div>
    <div id="list-tabs">
      <button id="tab-dots" class="active">Dots</button>
      <button id="tab-muscles">Muscles</button>
    </div>
    <div id="dot-list-head"><span>#</span><span>X</span><span>Y</span></div>
    <div id="dot-list"></div>
    <div id="muscle-list-head" hidden><span>#</span><span>X</span><span>Y</span></div>
    <div id="muscle-list" hidden></div>
    <button id="clear-btn">Clear All</button>
  </div>

</div>
<script src="main.js"></script>
</body>
</html>
